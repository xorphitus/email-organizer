# Copy to ~/.config/email-organizer/config.yaml (or pass --config).

model:
  repo: Cloudflare/clef
  # path: ~/.local/share/email-organizer/clef-nf4   # output of `email-organizer quantize` (fast load)
  quantization: nf4             # nf4 (fits a 24 GB GPU) | bf16 (needs ~54 GB VRAM)
  max_length: 2048
  threshold: 0.6                # below this top probability the message stays in the inbox
  batch_size: 1

# Each category is one option of a single "choice" question that Clef must answer, so every
# email lands in exactly one. Clef reads both the category id and its `criteria`: use ids with
# a plain meaning, and describe what makes the mail belong there. folder: INBOX = leave in place.
#
# Split by what you do with the mail (as in HEY's Imbox / Paper Trail / Feed), not by topic.
# Anything uncertain (below `threshold`) also stays in the inbox, so mistakes fail safe.
categories:
  important:
    criteria: >-
      Needs my attention: written by a real person to me (replies, conversations, questions,
      invitations), or asks me to act or decide soon, such as security alerts, sign-in codes,
      payment problems, appointments and deadlines.
    folder: INBOX
  paper_trail:
    criteria: >-
      A record to keep but not read: receipts, invoices, order and shipping confirmations,
      bookings and tickets, account statements, subscription renewals, and policy or terms
      updates. Sent automatically because of something I did.
    folder: Paper Trail
  feed:
    criteria: >-
      Bulk reading I subscribed to: newsletters, digests, blog and product updates, marketing
      and promotions, social media and community notifications. Usually sent to a mailing list.
    folder: Feed

accounts:
  - {name: fastmail, type: fastmail, token_env: FASTMAIL_API_TOKEN}
  - name: proton
    type: proton
    host: 127.0.0.1
    port: 1143
    username: you@proton.me
    password_env: PROTON_BRIDGE_PASSWORD
    # Pin Bridge's self-signed cert (SHA-256 of the DER cert), or set verify: false (localhost only).
    # cert_fingerprint: "ab:cd:…"
    verify: false
