[project]
name = "email-organizer"
version = "0.1.0"
description = "Classify inbox mail with Cloudflare Clef (local GPU) and file it into folders on Fastmail / ProtonMail"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "torchvision",
    # Clef was tested with transformers 5.10.2 (Qwen3_5ForConditionalGeneration).
    "transformers==5.10.2",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    "huggingface_hub>=0.30",
    "safetensors",
    "pillow",
    "httpx>=0.27",
    "imapclient>=3.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
email-organizer = "email_organizer.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_organizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
